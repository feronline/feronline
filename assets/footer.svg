<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Thanks for playing. Continue at feronlinegames.com">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="8" y="8" width="2" height="2" fill="#1f2440"/>
    </pattern>
    <style>
      .big { font: bold 26px 'Courier New', Courier, monospace; letter-spacing: 5px; }
      .small { font: bold 15px 'Courier New', Courier, monospace; letter-spacing: 3px; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="900" height="110" rx="16" fill="#0d0f1a"/>
  <rect width="900" height="110" rx="16" fill="url(#grid)"/>
  <text x="452" y="50" class="big" fill="#ff7a1a" text-anchor="middle">THANKS FOR PLAYING</text>
  <text x="450" y="48" class="big" fill="#ffffff" text-anchor="middle">THANKS FOR PLAYING</text>
  <text x="450" y="82" class="small" fill="#ffd23f" text-anchor="middle"><tspan class="blink">CONTINUE?</tspan><tspan fill="#2ee6c5"> FERONLINEGAMES.COM</tspan></text>
  <rect x="1.5" y="1.5" width="897" height="107" rx="15" fill="none" stroke="#2a3050" stroke-width="3"/>
</svg>
