<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Ferhat Topcuoglu, Unity game developer at FerOnline Games">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="8" y="8" width="2" height="2" fill="#1f2440"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f1a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d0f1a" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="270" rx="16"/></clipPath>
    <style>
      .hud  { font: bold 15px 'Courier New', Courier, monospace; letter-spacing: 2px; }
      .name { font: bold 50px 'Courier New', Courier, monospace; letter-spacing: 3px; }
      .sub  { font: bold 17px 'Courier New', Courier, monospace; letter-spacing: 4px; }
      .start{ font: bold 18px 'Courier New', Courier, monospace; letter-spacing: 6px; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .fall { animation: fall linear infinite; }
      @keyframes fall { from { transform: translateY(-120px); } to { transform: translateY(400px); } }
      .f1 { animation-duration: 7s; }
      .f2 { animation-duration: 9s; animation-delay: -3s; }
      .f3 { animation-duration: 6s; animation-delay: -5s; }
      .f4 { animation-duration: 10s; animation-delay: -1s; }
      .f5 { animation-duration: 8s; animation-delay: -6s; }
      .f6 { animation-duration: 11s; animation-delay: -8s; }
      .float { animation: float 3s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-5px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="270" fill="#0d0f1a"/>
    <rect width="900" height="270" fill="url(#grid)"/>

    <!-- falling blocks -->
    <g opacity="0.55">
      <g class="fall f1"><g transform="translate(40,0)" fill="#ff7a1a"><rect width="16" height="16"/><rect x="18" width="16" height="16"/><rect x="18" y="18" width="16" height="16"/><rect x="36" y="18" width="16" height="16"/></g></g>
      <g class="fall f2"><g transform="translate(120,0)" fill="#2ee6c5"><rect width="16" height="16"/><rect y="18" width="16" height="16"/><rect y="36" width="16" height="16"/><rect x="18" y="36" width="16" height="16"/></g></g>
      <g class="fall f3"><g transform="translate(760,0)" fill="#8b5cf6"><rect width="16" height="16"/><rect x="18" width="16" height="16"/><rect width="16" height="16" y="18"/><rect x="18" y="18" width="16" height="16"/></g></g>
      <g class="fall f4"><g transform="translate(836,0)" fill="#ffd23f"><rect width="16" height="16"/><rect y="18" width="16" height="16"/><rect y="36" width="16" height="16"/><rect y="54" width="16" height="16"/></g></g>
      <g class="fall f5"><g transform="translate(690,0)" fill="#ff4d6d"><rect x="18" width="16" height="16"/><rect y="18" width="16" height="16"/><rect x="18" y="18" width="16" height="16"/><rect x="36" y="18" width="16" height="16"/></g></g>
      <g class="fall f6"><g transform="translate(190,0)" fill="#4da3ff"><rect width="16" height="16"/><rect x="18" width="16" height="16"/><rect x="36" width="16" height="16"/><rect x="36" y="18" width="16" height="16"/></g></g>
    </g>
    <rect y="150" width="900" height="120" fill="url(#fade)"/>

    <!-- HUD -->
    <text x="32" y="38" class="hud" fill="#ff4d6d">1UP</text>
    <text x="80" y="38" class="hud" fill="#ffffff">GAMES 06</text>
    <text x="450" y="38" class="hud" fill="#ff4d6d" text-anchor="middle">HI-SCORE</text>
    <text x="450" y="58" class="hud" fill="#ffffff" text-anchor="middle">1200+ DEMO DOWNLOADS</text>
    <text x="868" y="38" class="hud" fill="#2ee6c5" text-anchor="end">LVL UNITY</text>

    <!-- title -->
    <g class="float">
      <text x="453" y="136" class="name" fill="#ff7a1a" text-anchor="middle">FERHAT TOPCUOĞLU</text>
      <text x="450" y="133" class="name" fill="#ffffff" text-anchor="middle">FERHAT TOPCUOĞLU</text>
    </g>
    <text x="450" y="172" class="sub" fill="#2ee6c5" text-anchor="middle">UNITY GAME DEVELOPER · FERONLINE GAMES</text>

    <text x="450" y="230" class="start blink" fill="#ffd23f" text-anchor="middle">PRESS START</text>

    <rect x="1.5" y="1.5" width="897" height="267" rx="15" fill="none" stroke="#2a3050" stroke-width="3"/>
  </g>
</svg>
